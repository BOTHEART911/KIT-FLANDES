<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Oscar Polania · Experto en soluciones digitales">
<title>Oscar Polania · Experto en soluciones digitales</title>
<style>
@keyframes deriva1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,40px) scale(1.15)}}
@keyframes deriva2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-110px,-30px) scale(.9)}}
@keyframes deriva3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-50px)}}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes giraInv{to{transform:rotate(-360deg)}}
@keyframes pulso{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}
@keyframes brillo{0%{transform:translateX(-700px)}60%,100%{transform:translateX(900px)}}
@keyframes escribe{0%{width:0}45%,100%{width:486px}}
@keyframes sigue{0%{transform:translateX(0)}45%,100%{transform:translateX(482px)}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes linea{0%{stroke-dashoffset:520}100%{stroke-dashoffset:0}}
@keyframes titila{0%,100%{opacity:.15}50%{opacity:.9}}
.b1{animation:deriva1 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b2{animation:deriva2 17s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b3{animation:deriva3 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flota{animation:flota 5s ease-in-out infinite}
.anillo{animation:gira 22s linear infinite;transform-origin:230px 180px}
.anillo2{animation:giraInv 34s linear infinite;transform-origin:230px 180px}
.halo{animation:pulso 4s ease-in-out infinite;transform-origin:230px 180px}
.chip{animation:sube .8s ease-out both}
.nombre{animation:sube .9s .15s ease-out both}
.brillo{animation:brillo 5.5s ease-in-out infinite}
.tipeo{animation:escribe 7s steps(31,end) infinite}
.cursor{animation:cursor .9s step-end infinite}
.sigue{animation:sigue 7s steps(31,end) infinite}
.linea{stroke-dasharray:520;animation:linea 2.4s .5s ease-out both}
.p1{animation:titila 3s ease-in-out infinite}
.p2{animation:titila 3s 1s ease-in-out infinite}
.p3{animation:titila 3s 2s ease-in-out infinite}
</style>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2419"/></linearGradient>
<linearGradient id="gNombre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9fff1"/><stop offset=".5" stop-color="#5ee39a"/><stop offset="1" stop-color="#e9fff1"/></linearGradient>
<linearGradient id="gBrillo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gHalo"><stop offset="0" stop-color="#2ecc71" stop-opacity=".55"/><stop offset="1" stop-color="#2ecc71" stop-opacity="0"/></radialGradient>
<filter id="desenfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
<clipPath id="marco"><rect width="1280" height="360" rx="28"/></clipPath>
<clipPath id="recorteTipeo"><rect class="tipeo" x="466" y="212" width="486" height="60"/></clipPath>
<mask id="mNombre"><text x="470" y="186" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#fff">Oscar Polania</text></mask>
<pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#5ee39a" opacity=".18"/></pattern>
</defs>
<g clip-path="url(#marco)">
<rect width="1280" height="360" fill="url(#fondo)"/>
<g filter="url(#desenfoque)" opacity=".20">
<circle class="b1" cx="180" cy="80" r="170" fill="#2ecc71"/>
<circle class="b2" cx="1080" cy="300" r="190" fill="#4285f4"/>
<circle class="b3" cx="760" cy="40" r="130" fill="#f4b400"/>
</g>
<rect width="1280" height="360" fill="url(#puntos)"/>
<circle class="p1" cx="1160" cy="70" r="3" fill="#f4b400"/>
<circle class="p2" cx="1210" cy="130" r="2.2" fill="#2ecc71"/>
<circle class="p3" cx="1110" cy="110" r="2.6" fill="#4285f4"/>
<circle class="p2" cx="410" cy="300" r="2.4" fill="#f4b400"/>
<circle class="p1" cx="90" cy="300" r="2" fill="#4285f4"/>
</g>
<rect x=".75" y=".75" width="1278.5" height="358.5" rx="27.5" fill="none" stroke="#17382a" stroke-width="1.5"/>
<g class="flota">
<circle class="halo" cx="230" cy="180" r="150" fill="url(#gHalo)"/>
<circle class="anillo" cx="230" cy="180" r="128" fill="none" stroke="#5ee39a" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round" opacity=".75"/>
<circle class="anillo2" cx="230" cy="180" r="140" fill="none" stroke="#f4b400" stroke-width="2" stroke-dasharray="120 60 30 60" stroke-linecap="round" opacity=".55"/>
<image href="data:image/webp;base64," x="118" y="68" width="224" height="224" filter="url(#sombra)"/>
</g>
<g class="chip">
<rect x="470" y="82" width="228" height="34" rx="17" fill="#0f2e20" stroke="#1f5b3c"/>
<circle cx="492" cy="99" r="5" fill="#2ecc71"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="506" y="104.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#8ff0b8">DESARROLLADOR</text>
</g>
<g class="nombre">
<text x="470" y="186" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5" fill="url(#gNombre)">Oscar Polania</text>
<g mask="url(#mNombre)"><rect class="brillo" x="0" y="100" width="260" height="110" fill="url(#gBrillo)"/></g>
</g>
<path class="linea" d="M472 208 H992" stroke="#5ee39a" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>
<g clip-path="url(#recorteTipeo)">
<text x="470" y="254" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="500" fill="#b7d6c4">Experto en soluciones digitales</text>
</g>
<g class="sigue"><rect class="cursor" x="472" y="226" width="3" height="36" rx="1.5" fill="#5ee39a"/></g>
</svg>
